spring:
  application:
    name: pulsepass-concert

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulsepass}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:

    open-in-view: false

    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
pulsepass:
  security:
    jwt:
      issuer: ${PULSEPASS_JWT_ISSUER:pulsepass-api}
      secret-base64: ${PULSEPASS_JWT_SECRET_BASE64}
      access-token-ttl: PT15M
    cors:
      # Lista separada por comas. Vacío = ningún origen de navegador permitido.
      allowed-origins: ${PULSEPASS_CORS_ALLOWED_ORIGINS:}
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
